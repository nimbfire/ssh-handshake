# /etc/ssh/sshd_config.d/ssh-handshake.conf
#
# Aplica o ssh-handshake a todos os membros do grupo "ssh-handshake".
# Recomendado: modo "system" (hash root-owned, enrollment feito pelo admin).

Match Group ssh-handshake
    ForceCommand /usr/local/bin/ssh-handshake login --store system
    # Sem isto, `ssh -N -L/-R/-D` abre túneis SEM passar pelo handshake:
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    PermitTunnel no
    X11Forwarding no
    AllowAgentForwarding no
    # ~/.ssh/rc roda ANTES do ForceCommand, com código do usuário:
    PermitUserRC no
    # PermitUserEnvironment é "no" por padrão. Mantenha assim (global).

# Variante modo "home" (hash em ~/.ssh, criação no primeiro login - menos segura):
# Match Group ssh-handshake
#     ForceCommand /usr/local/bin/ssh-handshake login --store home --allow-self-enroll
#     (mesmas restrições de forwarding acima)
