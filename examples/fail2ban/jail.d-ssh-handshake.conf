# /etc/fail2ban/jail.d/ssh-handshake.conf
[ssh-handshake]
enabled  = true
filter   = ssh-handshake
backend  = systemd
journalmatch = SYSLOG_IDENTIFIER=ssh-handshake
# Em sistemas sem journald use: logpath = /var/log/auth.log  (e remova backend/journalmatch)
port     = ssh
maxretry = 3
findtime = 10m
bantime  = 1h
